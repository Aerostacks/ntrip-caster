[project]
name = "ntrip-caster"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["aero-config==0.1.0a1"]

[tool.uv.sources]
aero-config = { path = "vendor/aero_config-0.1.0a1-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.4"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "A", "RUF"]
